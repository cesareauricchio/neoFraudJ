services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  neo4j:
    image: neo4j:5.18-community
    container_name: neofraudj-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neofraudj_secret}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "2G"
      NEO4J_dbms_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test:
        - CMD
        - cypher-shell
        - -u
        - neo4j
        - -p
        - ${NEO4J_PASSWORD:-neofraudj_secret}
        - "RETURN 1"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - neofraudj-net

  redis:
    image: redis:7.2-alpine
    container_name: neofraudj-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - neofraudj-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: neofraudj-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - neofraudj-net

  # ── Application Services ───────────────────────────────────────────────────

  ingestion-service:
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile
    container_name: neofraudj-ingestion
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_STREAM_NAME: neofraudj:transactions
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - neofraudj-net
    restart: unless-stopped

  processor-service:
    build:
      context: .
      dockerfile: processor-service/Dockerfile
    container_name: neofraudj-processor
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_STREAM_NAME: neofraudj:transactions
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neofraudj_secret}
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - neofraudj-net
    restart: unless-stopped

  detection-service:
    build:
      context: .
      dockerfile: detection-service/Dockerfile
    container_name: neofraudj-detection
    ports:
      - "8002:8002"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neofraudj_secret}
      REDIS_URL: redis://redis:6379
      REDIS_STREAM_NAME: neofraudj:transactions
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neofraudj-net
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: neofraudj-ui
    ports:
      - "5173:5173"
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - detection-service
    networks:
      - neofraudj-net
    restart: unless-stopped

  bulk-seeder:
    image: python:3.12-slim
    container_name: neofraudj-bulk-seeder
    volumes:
      - ./scripts:/scripts
    working_dir: /scripts
    environment:
      PYTHONUNBUFFERED: "1"
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neofraudj_secret}
    command: sh -c "pip install -q httpx neo4j && python bulk_seed.py --url http://ingestion-service:8001 --neo4j-uri bolt://neo4j:7687 --neo4j-user neo4j --neo4j-password $${NEO4J_PASSWORD}"
    depends_on:
      neo4j:
        condition: service_healthy
      ingestion-service:
        condition: service_started
    networks:
      - neofraudj-net
    restart: "no"

  stream-seeder:
    image: python:3.12-slim
    container_name: neofraudj-stream-seeder
    volumes:
      - ./scripts:/scripts
    working_dir: /scripts
    environment:
      PYTHONUNBUFFERED: "1"
    command: sh -c "pip install -q httpx && python stream_seed.py --url http://ingestion-service:8001"
    depends_on:
      bulk-seeder:
        condition: service_completed_successfully
      ingestion-service:
        condition: service_started
    networks:
      - neofraudj-net
    restart: unless-stopped

networks:
  neofraudj-net:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  redis_data:
  ui_node_modules:
